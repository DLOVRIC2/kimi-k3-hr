# CONTROL ARM — reproduces the reference calibration mix used by the published
# REAP builds (40% code / 30% English / 15% Chinese / 15% other languages).
#
# You need this arm. Without a control you cannot claim a Croatian-targeted build
# is better, only that it exists. Both arms come from this same pipeline, so the
# corpus is the ONLY variable between them.
#
# Every source is public and ungated, so anyone can reproduce these builds exactly.
# That is deliberate: a corpus drawn from private repos makes the result
# unverifiable, which defeats the point of publishing it.
name: control-reference-mix
sources:
  - tag: code
    ratio: 0.40
    kind: hf
    dataset: codeparrot/github-code-clean
    config: Python-all
    text_field: code
    min_chars: 400
  - tag: en
    ratio: 0.30
    kind: hf
    dataset: wikimedia/wikipedia
    config: 20231101.en
  - tag: zh
    ratio: 0.15
    kind: hf
    dataset: wikimedia/wikipedia
    config: 20231101.zh
  - tag: de
    ratio: 0.05
    kind: hf
    dataset: wikimedia/wikipedia
    config: 20231101.de
  - tag: ru
    ratio: 0.05
    kind: hf
    dataset: wikimedia/wikipedia
    config: 20231101.ru
  - tag: fr
    ratio: 0.05
    kind: hf
    dataset: wikimedia/wikipedia
    config: 20231101.fr
