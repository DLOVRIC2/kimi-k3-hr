# ABLATION — Croatian dominant, minimal code.
#
# Their Chinese ablation showed language-only calibration produced "vague but no
# loop" output — WORSE than language+code. If that pattern repeats here, this arm
# should underperform hr-code, replicating their finding on a different language
# family. A clean negative is as publishable as a positive.
name: hr-heavy
sources:
  - tag: hr
    ratio: 0.70
    kind: hf
    dataset: wikimedia/wikipedia
    config: 20231101.hr
  - tag: sl_neighbours
    ratio: 0.15
    kind: hf
    dataset: wikimedia/wikipedia
    config: 20231101.sr
  - tag: code
    ratio: 0.10
    kind: hf
    dataset: codeparrot/github-code-clean
    config: Python-all
    text_field: code
    min_chars: 400
  - tag: en
    ratio: 0.05
    kind: hf
    dataset: wikimedia/wikipedia
    config: 20231101.en
